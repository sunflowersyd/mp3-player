<DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>for him <3</title>

    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">

</head>

<body>

    <div class="app-container">

        <div class="player-container">


        <div class="top-bar">       
            <p>Now Playing</p>
        </div>     
    

    <div class="album-selection">

        <img id="album-cover" src="assets/swans.jpg" alt="album-cover" width="190" height="190">

    </div>

    <div class="song-container">

        <p id="song-name">song name</p>
        <p id="artist-name">artist name</p>

    </div>

    <div class="progress-container">

        <p id="current-time" class="time">0:00</p>
        <input type="range" id="progress-bar" min="0" max="100" value="0">
        <p id="total-time" class="time">0:00</p>

    </div>

    <audio id="audio-player" preload="auto"></audio>

    <div class="controls">

        <button class="previousBtn" id="previousBtn" type="button">prev</button>
        <button class="playBtn" id="playBtn" type="button">play</button>
        <button class="nextBtn" id="nextBtn" type="button">next</button>

    </div>

    </div>

    </div>

</body>

<script src="script.js"></script>

</html>
